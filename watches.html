<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Watch Details</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="photos/icons/navbar.png"></head>
<body>
<header class="navbar">
  <div class="logo"><img src="photos/icons/navbar.png" alt="Watch Atlas"></div>

  <nav>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="blog.html">Blogs</a></li>
      <li><a href="casio.html">Casio</a></li>
      <li><a href="seiko.html">Seiko</a></li>
      <li><a href="citizen.html">Citizen</a></li>
      <li><a href="orient.html">Orient</a></li>
      <li class="nav-search">
        <input id="search-input" type="search" placeholder="Search watches">
      </li>
    </ul>
  </nav>

  <div class="menu-toggle" id="menu-toggle">&#9776;</div>
</header>

<main class="watch-detail">
  <div class="watch-left">
    <div class="watch-detail-media">
      <div class="watch-gallery">
        <img id="watch-image" class="watch-hero" alt="Watch image">
        <div class="watch-thumbs" id="watch-thumbs"></div>
        <div class="watch-dots" id="watch-dots" aria-label="Gallery navigation"></div>
      </div>
    </div>
    <section class="watch-similar">
      <h2>Similar Watches</h2>
      <div class="similar-grid" id="similar-watches"></div>
    </section>
  </div>
  <div class="watch-detail-info">
    <p class="watch-brand" id="watch-brand"></p>
    <h1 id="watch-name"></h1>
    <p class="watch-description" id="watch-description"></p>
    <div class="watch-long-description" id="watch-long-description"></div>
    <div class="watch-specs">
      <h2>Specifications</h2>
      <ul id="watch-specs-list"></ul>
    </div>
    <div class="watch-features">
      <h2>Features</h2>
      <ul id="watch-features-list"></ul>
    </div>
    <div class="watch-meta">
      <span id="watch-price"></span>
    </div>
    <a id="watch-affiliate" class="slide-button" target="_blank" rel="noopener">Check Price</a>
    <a class="back-link" href="index.html">Back to Home</a>
  </div>
</main>

<script src="otherpage.js"></script>
<script src="watch.js"></script>
<footer class="site-footer">
  <div class="footer-meta">
    <p>Products sold on Amazon.</p>
    <div class="footer-legal">
      <a href="policy.html#affiliate-disclosure">Affiliate Disclosure</a>
      <a href="policy.html#privacy-policy">Privacy Policy</a>
      <a href="policy.html">Policy</a>
    </div>
  </div>
  <div class="footer-socials">
    <a href="https://instagram.com/watch.atlas" target="_blank" rel="noopener" aria-label="Instagram"><img src="photos/icons/instagram-white-icon.png" alt="Instagram"></a>
    <a href="https://www.tiktok.com/@watch_atlas" target="_blank" rel="noopener" aria-label="TikTok"><img src="photos/icons/tiktok-simplified-white-icon.png" alt="TikTok"></a>
  </div>
</footer>
</body>
</html>
